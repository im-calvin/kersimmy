services:
  reader:
    image: ${READER_IMAGE:-ghcr.io/im-calvin/translate:latest}
    restart: unless-stopped
    environment:
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-900}"
      BACKUP_KEEP: "${BACKUP_KEEP:-96}"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - reader_data:/data
    networks:
      tunnel:
        aliases:
          - translation-reader
    stop_grace_period: 30s

volumes:
  reader_data:
    external: true
    name: ${READER_DATA_VOLUME:-translation-reader_reader_data}

networks:
  tunnel:
    external: true
    name: ${CLOUDFLARED_NETWORK:?Set CLOUDFLARED_NETWORK to the network shared with cloudflared}
